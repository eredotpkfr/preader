coverage: # https://docs.codecov.com/docs/codecovyml-reference#coverage
  precision: 2 # e.g. 98.34%
  round: nearest
  range: 90..100 # https://docs.codecov.com/docs/coverage-configuration#section-range

  status: # https://docs.codecov.com/docs/commit-status
    project:
      default:
        target: auto
        threshold: "1%"
        if_ci_failed: error
        branches:
          - main
    patch:
      default:
        target: auto
        threshold: "1%"
        if_ci_failed: error
        branches:
          - main

ignore:
  - "src/lib.rs"
