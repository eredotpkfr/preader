# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
        exclude: |
          (?x)^(
            build\.rs|
            src/lib\.rs|
            tests/rust/main\.rs
          )$
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=4"
      - id: destroyed-symlinks
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.6.0
    hooks:
      - id: validate_manifest

  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.19.6
    hooks:
      - id: cargo-deny
        name: cargo-deny
        args: ["--all-features", "--log-level", "error", "check"]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.25.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        exclude: |
          (?x)^(
            Cargo\.lock
          )$

  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.15.0
    hooks:
      - id: markdownlint
        name: markdownlint
        exclude: |
          (?x)^(
            CHANGELOG\.md
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: cargo-rustfmt-check
        name: cargo-rustfmt-check
        entry: make cargo-rustfmt-check
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: cargo-check
        name: cargo-check
        entry: make cargo-check
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo-clippy
        entry: make cargo-clippy
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: cargo-udeps
        name: cargo-udeps
        entry: make cargo-udeps
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: ruff-check
        name: ruff-check
        entry: make ruff-check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: ruff-format-check
        name: ruff-format-check
        entry: make ruff-format-check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: make mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: uv-audit
        name: uv-audit
        entry: make uv-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: cargo-test
        name: cargo-test
        entry: make cargo-test
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: cargo-nextest
        name: cargo-nextest
        entry: make cargo-nextest
        language: system
        files: (Cargo\.lock|\.(rs|toml))$
        pass_filenames: false

      - id: stubtest
        name: stubtest
        entry: make stubtest
        language: system
        files: (\.(lock|py|pyi|rs|toml)|stubtest-allowlist\.txt)$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: make pytest
        language: system
        files: \.(lock|py|rs|toml)$
        pass_filenames: false
