[package]
name = "preader"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "preader"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
pyo3 = { version = "0.28.2", features = ["abi3-py38"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
toml = "1.1.2"
