[package]
name = "preader"
version = "0.1.0"
edition = "2024"
description = "A Python package that reads a file along with its read percentage"
license = "MIT"
readme = "README.md"
repository = "https://github.com/eredotpkfr/preader"
homepage = "https://www.erdoganyoksul.com/preader/"
documentation = "https://www.erdoganyoksul.com/preader/"
keywords = ["file-reader", "resumable", "checksum", "progress", "iterator"]
categories = ["filesystem"]
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "preader"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2", default-features = false, features = ["deref", "eq", "from"] }
dirs = "6.0.0"
dunce = "1.0.5"
hex = "0.4.3"
pyo3 = { version = "0.29.2", features = ["abi3-py312", "chrono"], optional = true }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
walkdir = "2.5.0"

# pyo3 has no consumer until src/python/ returns with the bindings; the feature
# wiring itself is verified (cargo test needs no interpreter, maturin still builds)
[package.metadata.cargo-machete]
ignored = ["pyo3"]

[package.metadata.cargo-udeps.ignore]
normal = ["pyo3"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-build-config"]
extension-module = ["python", "pyo3/extension-module"]
experimental-inspect = ["python", "pyo3/experimental-inspect"]

[build-dependencies]
pyo3-build-config = { version = "0.29.2", optional = true }

[dev-dependencies]
rstest = "0.26"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
