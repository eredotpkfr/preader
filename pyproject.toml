[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "preader"
description = "A Python package that reads a file along with its read percentage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Erdoğan YOKSUL", email = "erdoganyoksul3@gmail.com" },
]
maintainers = [
    { name = "Erdoğan YOKSUL", email = "erdoganyoksul3@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["file-reader", "resumable", "iterator", "checksum", "progress-tracking"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
dynamic = ["version"]

[project.urls]
homepage = "https://www.erdoganyoksul.com/preader/"
documentation = "https://www.erdoganyoksul.com/preader/"
repository = "https://github.com/eredotpkfr/preader"
changelog = "https://github.com/eredotpkfr/preader/blob/main/CHANGELOG.md"
issues = "https://github.com/eredotpkfr/preader/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "maturin>=1.15.0,<2.0",
    "pytest",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-repeat",
    "pytest-socket",
    "pytest-icdiff",
    "pytest-sugar",
    "mypy",
    "ruff",
]

[tool.mypy]
files = ["python/preader", "tests/python"]
exclude = ['python/preader/preader\.pyi$']
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-n auto -ra --disable-socket --strict-config --strict-markers"
filterwarnings = ["error"]
testpaths = ["tests/python"]
timeout = 10

[tool.ruff]
extend-exclude = ["python/preader/preader.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["constants", "preader"]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D1",
    "FBT001",
    "INP001",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "S101",
]
