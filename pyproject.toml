[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "preader"
description = "A Python package for reading files with live read-percentage tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Erdoğan YOKSUL", email = "erdoganyoksul3@gmail.com" },
]
maintainers = [
    { name = "Erdoğan YOKSUL", email = "erdoganyoksul3@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["file-reader", "resumable", "iterator", "checksum", "progress-tracking"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
dynamic = ["version"]

[project.urls]
homepage = "https://www.erdoganyoksul.com/preader/"
documentation = "https://www.erdoganyoksul.com/preader/"
repository = "https://github.com/eredotpkfr/preader"
changelog = "https://github.com/eredotpkfr/preader/blob/main/CHANGELOG.md"
issues = "https://github.com/eredotpkfr/preader/issues"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.maturin.generate-ci.github.all]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "maturin>=1.15.0,<2.0",
    "pytest",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-repeat",
    "pytest-socket",
    "pytest-icdiff",
    "pytest-sugar",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-n auto -ra --disable-socket"
testpaths = ["tests/python"]
timeout = 10
